[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = paste@localhost
email_to = test@ckan.org

[server:main]
use = egg:Paste#http
host = 0.0.0.0
port = 5000

[app:main]
use = config:../ckan/test-core.ini

# Insert any custom config settings to be used when running your extension's
# tests here.

# Override plugins to exclude recline_view and recline_grid_view (removed in CKAN 2.11)
ckan.plugins = stats text_view image_view webpage_view datastore datapusher restricted

# DataPusher configuration (required in CKAN 2.11)
ckan.datapusher.api_token = test-token
ckan.datapusher.url = http://datapusher:8800


# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s